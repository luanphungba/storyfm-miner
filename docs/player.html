<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- The audio CDN is fine with hotlinking, but there is no reason to leak the page URL to it. -->
<meta name="referrer" content="no-referrer">
<title>故事FM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <h1 id="title">Đang tải…</h1>
  <p class="meta" id="meta"></p>

  <details class="summary" id="summary" open hidden>
    <summary>Tóm tắt nội dung</summary>
    <div id="summary-body" lang="vi"></div>
  </details>

  <details class="summary chapters" id="chapters" hidden>
    <summary id="chapters-label">Chương</summary>
    <ol class="toc" id="chapter-list"></ol>
  </details>

  <div class="toolbar">
    <button class="chip" id="filter-all" aria-pressed="true">Tất cả</button>
    <button class="chip" id="filter-storyteller" aria-pressed="false">Chỉ người kể</button>
    <button class="chip" id="copy" type="button" title="Chép các câu đang hiện, mỗi câu một dòng">Copy text</button>
    <button class="chip" id="font-smaller" type="button" title="Chữ nhỏ hơn" aria-label="Chữ nhỏ hơn">A−</button>
    <button class="chip" id="font-larger" type="button" title="Chữ to hơn" aria-label="Chữ to hơn">A+</button>
    <button class="chip" id="anki-settings" type="button" title="Kết nối server Anki">Anki</button>
    <a class="chip" id="open-bilibili" href="#" target="_blank" rel="noopener" style="text-decoration:none" title="Mở video trên Bilibili, đúng chỗ đang nghe" hidden>Bilibili ↗</a>
    <a class="chip" href="listen.html" style="text-decoration:none" title="Phát lại các chương đã học">▶ Nghe lại</a>
    <a class="chip" href="index.html" style="text-decoration:none">← Danh sách</a>
  </div>

  <div id="cues"></div>
</div>

<div class="player">
  <div id="gloss" hidden></div>
  <div id="shot-viewer" class="shot-viewer" role="dialog" aria-label="Màn hình trên máy" hidden>
    <div class="sv-bar">
      <button id="sv-prev" type="button" aria-label="Ảnh trước">‹</button>
      <span id="sv-title"></span>
      <button id="sv-next" type="button" aria-label="Ảnh sau">›</button>
      <button id="sv-close" type="button" aria-label="Đóng">✕</button>
    </div>
    <div class="sv-body"><div class="sv-frame" id="sv-frame"><img id="sv-img" alt=""><div id="sv-box" class="sv-box" hidden></div></div></div>
  </div>
  <div class="chapterbar" id="chapterbar" hidden>
    <button class="chip" id="chapter-prev" type="button" title="Chương trước" aria-label="Chương trước">‹</button>
    <button class="chapter-now" id="chapter-now" type="button" title="Cuộn tới đầu chương"><span id="chapter-title"></span></button>
    <span class="chapter-stats" id="chapter-stats" title="Lượt đang nghe · thời gian đã nghe chương này"></span>
    <button class="chip" id="chapter-next" type="button" title="Chương sau" aria-label="Chương sau">›</button>
  </div>
  <div class="loopbar" id="loopbar">
    <span class="time-field">
      <input class="time-input" id="loop-start" type="text" inputmode="decimal" placeholder="0:00" aria-label="Điểm bắt đầu lặp">
      <button class="time-now" id="loop-start-now" type="button" title="Lấy thời điểm đang phát">Từ đây</button>
    </span>
    <span class="loopbar-arrow" aria-hidden="true">→</span>
    <span class="time-field">
      <input class="time-input" id="loop-end" type="text" inputmode="decimal" placeholder="0:00" aria-label="Điểm kết thúc lặp">
      <button class="time-now" id="loop-end-now" type="button" title="Lấy thời điểm đang phát">Đến đây</button>
    </span>
    <button class="chip" id="loop-toggle" type="button" aria-pressed="false" disabled>↻ Lặp</button>
    <button class="chip" id="loop-clear" type="button" title="Xoá đoạn lặp" hidden>✕</button>
    <button class="chip" id="chapter-done" type="button" aria-pressed="false" hidden>✓ Học xong</button>
    <a class="chip" id="open-listen" href="listen.html" title="Phát lại các chương đã học" hidden>▶ Nghe lại</a>
    <a class="chip is-primary" id="next-episode" href="#" hidden>Tập tiếp ›</a>
    <span class="player-toggles">
      <a class="chip" id="to-list" href="index.html" title="Về danh sách tập">← Danh sách</a>
      <button class="chip" id="repeat-episode" type="button" aria-pressed="false" title="Hết bài thì phát lại từ đầu">Lặp cả bài</button>
      <button class="chip" id="show-vi" type="button" aria-pressed="false" title="Hiện bản dịch tiếng Việt của mọi câu" hidden>Hiện dịch</button>
    </span>
  </div>
  <div class="speedbar" id="speedbar">
    <button class="chip speed" type="button" data-rate="0.5" aria-pressed="false">0.5x</button>
    <button class="chip speed" type="button" data-rate="0.75" aria-pressed="false">0.75x</button>
    <button class="chip speed" type="button" data-rate="1" aria-pressed="true">1x</button>
    <button class="chip speed" type="button" data-rate="1.25" aria-pressed="false">1.25x</button>
    <button class="chip speed" type="button" data-rate="1.5" aria-pressed="false">1.5x</button>
    <button class="chip speed" type="button" data-rate="2" aria-pressed="false">2x</button>
  </div>
  <audio id="audio" controls preload="metadata"></audio>
</div>

<dialog id="anki-dialog">
  <form id="anki-form">
    <h2>Kết nối Anki</h2>
    <p class="note">Server giữ một bản collection và sync qua AnkiWeb. Nhập một lần, trình duyệt này sẽ nhớ.</p>
    <label>Địa chỉ server
      <input id="anki-url" type="url" required placeholder="https://anki.luanphung.com" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label>Token
      <input id="anki-token" type="password" required autocomplete="off">
    </label>
    <p class="anki-status" id="anki-status" role="status"></p>
    <div class="dialog-actions">
      <button class="chip" id="anki-forget" type="button" hidden>Ngắt kết nối</button>
      <span class="spacer"></span>
      <button class="chip" id="anki-cancel" type="button">Huỷ</button>
      <button class="chip is-primary" id="anki-save" type="submit">Lưu &amp; kiểm tra</button>
    </div>
  </form>
</dialog>

<dialog id="study-dialog">
  <form method="dialog">
    <h2 id="study-title"></h2>
    <p class="note" id="study-note"></p>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button class="chip" value="cancel">Huỷ</button>
      <button class="chip is-primary" id="study-confirm" value="confirm"></button>
    </div>
  </form>
</dialog>

<dialog id="words-dialog" aria-labelledby="words-title">
  <div class="wd-body">
    <div class="wd-top">
      <h2 id="words-title" lang="zh-Hans"></h2>
      <button class="chip" id="words-gist" type="button" aria-pressed="false" title="Hiện cách đọc, nghĩa và câu của mọi từ; tắt thì chỉ còn từ và cấp HSK, chạm một từ để lật riêng nó">Nghĩa</button>
      <button class="chip" id="words-play" type="button" aria-pressed="false" disabled title="Nghe lần lượt câu có từng từ, hết danh sách thì nghe lại từ đầu">▶ Nghe</button>
      <button class="g-close" id="words-close" type="button" aria-label="Đóng">✕</button>
    </div>
    <p class="wd-note" id="words-note"></p>
    <ol class="wd-list" id="words-list"></ol>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>

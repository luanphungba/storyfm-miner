<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- The audio CDN is fine with hotlinking, but there is no reason to leak the page URL to it. -->
<meta name="referrer" content="no-referrer">
<title>故事FM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <h1 id="title">Đang tải…</h1>
  <p class="meta" id="meta"></p>

  <div class="toolbar">
    <button class="chip" id="filter-all" aria-pressed="true">Tất cả</button>
    <button class="chip" id="filter-storyteller" aria-pressed="false">Chỉ người kể</button>
    <button class="chip" id="copy" type="button" title="Chép các câu đang hiện, mỗi câu một dòng">Copy text</button>
    <a class="chip" href="index.html" style="text-decoration:none">← Danh sách</a>
  </div>

  <div id="cues"></div>
</div>

<div class="player">
  <div id="gloss" hidden></div>
  <div class="loopbar" id="loopbar">
    <span class="time-field">
      <input class="time-input" id="loop-start" type="text" inputmode="decimal" placeholder="0:00" aria-label="Điểm bắt đầu lặp">
      <button class="time-now" id="loop-start-now" type="button" title="Lấy thời điểm đang phát">Từ đây</button>
    </span>
    <span class="loopbar-arrow" aria-hidden="true">→</span>
    <span class="time-field">
      <input class="time-input" id="loop-end" type="text" inputmode="decimal" placeholder="0:00" aria-label="Điểm kết thúc lặp">
      <button class="time-now" id="loop-end-now" type="button" title="Lấy thời điểm đang phát">Đến đây</button>
    </span>
    <button class="chip" id="loop-toggle" type="button" aria-pressed="false" disabled>↻ Lặp</button>
    <button class="chip" id="loop-clear" type="button" title="Xoá đoạn lặp" hidden>✕</button>
  </div>
  <div class="speedbar" id="speedbar">
    <button class="chip speed" type="button" data-rate="0.5" aria-pressed="false">0.5x</button>
    <button class="chip speed" type="button" data-rate="0.75" aria-pressed="false">0.75x</button>
    <button class="chip speed" type="button" data-rate="1" aria-pressed="true">1x</button>
    <button class="chip speed" type="button" data-rate="1.25" aria-pressed="false">1.25x</button>
    <button class="chip speed" type="button" data-rate="1.5" aria-pressed="false">1.5x</button>
    <button class="chip speed" type="button" data-rate="2" aria-pressed="false">2x</button>
  </div>
  <audio id="audio" controls preload="metadata"></audio>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

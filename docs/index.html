<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>故事FM · Podcast · Bilibili — nghe có transcript</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <h1>故事FM</h1>
  <a class="meta hours" id="hours" href="stats.html" title="Xem thống kê" hidden></a>
  <p class="meta" id="meta">Đang tải…</p>
  <div class="toolbar">
    <a class="chip" href="listen.html" style="text-decoration:none" title="Phát lại các chương đã học">▶ Nghe lại</a>
    <a class="chip" href="stats.html" style="text-decoration:none" title="Giờ nghe, chương và từ mỗi ngày">Thống kê</a>
  </div>
  <nav class="toolbar topics" id="topics" aria-label="Chủ đề" hidden></nav>

  <section class="topic" id="topic" hidden>
    <div class="topic-card">
      <h2 class="topic-name"><span id="topic-name"></span> <span class="topic-zh" id="topic-zh" lang="zh-Hans"></span></h2>
      <p class="topic-about" id="topic-about"></p>
      <div id="topic-bar"></div>
      <p class="topic-progress" id="topic-progress"></p>
      <a class="topic-next" id="topic-next" href="#" hidden>
        <span id="topic-next-label"></span>
        <span class="topic-next-where" id="topic-next-where" lang="zh-Hans"></span>
      </a>
      <a class="chip" id="topic-listen" href="listen.html" title="Phát lại các chương đã học trong chủ đề này">▶ Nghe lại chủ đề</a>
    </div>
    <ol class="topic-list" id="topic-list"></ol>
    <div class="topic-planned" id="topic-planned" hidden>
      <h3 id="planned-heading"></h3>
      <ul id="planned-list"></ul>
    </div>
  </section>

  <div id="all">
    <div id="list"></div>
    <div id="podcasts"></div>
    <h2 class="section" id="ui-heading" hidden>Giao diện app</h2>
    <div id="ui-list"></div>
    <h2 class="section" id="bili-heading" hidden>Bilibili</h2>
    <div id="bili-list"></div>
  </div>
</div>

<script type="module" src="home.js"></script>
</body>
</html>
